<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成都地图拼图 · 认识 20 个区县</title>
<meta name="description" content="用拼图游戏认识成都的 20 个区县：拖动碎片放到地图上的正确位置，拼对后查看每个区县的面积、地标和冷知识。">
<link rel="stylesheet" href="css/style.css">
<script>
/* 在首屏渲染之前就把主题定下来。
   如果等 body 末尾的 game.js 再设，用户会看到一次"先默认色、后变主题"的闪烁。 */
try {
  var savedTheme = localStorage.getItem('chengdu-map-theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
} catch (e) { /* 隐私模式下 localStorage 可能不可用，忽略即可 */ }
</script>
</head>
<body>

<!-- =====================================================================
     SVG 图案库（手绘 · 全部由本文件内的矢量路径绘制，无任何外链图片）
     ---------------------------------------------------------------------
     用 <symbol> 定义一次、全页 <use> 复用。颜色一律走 currentColor 或
     CSS 变量，所以同一个图案在不同位置可以换色，且能被 CSS 继承。
     ===================================================================== -->
<svg class="svg-sprite" aria-hidden="true" focusable="false">
  <defs>

    <!-- 熊猫：成都的招牌。双色部件用 CSS 变量区分"墨"和"纸" -->
    <symbol id="i-panda" viewBox="0 0 64 64">
      <circle cx="15" cy="17" r="9" fill="var(--panda-ink, #16241f)"/>
      <circle cx="49" cy="17" r="9" fill="var(--panda-ink, #16241f)"/>
      <ellipse cx="32" cy="34" rx="21" ry="19" fill="var(--panda-paper, #f3f8f5)"/>
      <ellipse cx="23" cy="32" rx="7" ry="8.6" transform="rotate(-20 23 32)" fill="var(--panda-ink, #16241f)"/>
      <ellipse cx="41" cy="32" rx="7" ry="8.6" transform="rotate(20 41 32)" fill="var(--panda-ink, #16241f)"/>
      <circle cx="24" cy="31.2" r="2.5" fill="var(--panda-paper, #f3f8f5)"/>
      <circle cx="40" cy="31.2" r="2.5" fill="var(--panda-paper, #f3f8f5)"/>
      <ellipse cx="32" cy="43.2" rx="3.6" ry="2.6" fill="var(--panda-ink, #16241f)"/>
      <g fill="none" stroke="var(--panda-ink, #16241f)" stroke-width="1.7" stroke-linecap="round">
        <path d="M32 45.8 V48.6"/>
        <path d="M32 48.6 C 30 51.4, 27 51.8, 24.6 49.8"/>
        <path d="M32 48.6 C 34 51.4, 37 51.8, 39.4 49.8"/>
      </g>
    </symbol>

    <!-- 竹子：蜀地风骨。粗竿 + 一眼可辨的竹节 + 成簇的柳叶 -->
    <symbol id="i-bamboo" viewBox="0 0 100 140">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- 竹竿：加粗到 5.5，只留很轻的自然弯曲 -->
        <path d="M50 138 C 47 110, 52 78, 48 48 C 46 28, 50 14, 49 4" stroke-width="5.5"/>
        <!-- 竹节：短横线，要一眼能看出来 -->
        <path d="M45.6 116 h7.6" stroke-width="3"/>
        <path d="M46.8 92 h7.4" stroke-width="3"/>
        <path d="M47.6 68 h7.2" stroke-width="3"/>
        <path d="M47.8 44 h7" stroke-width="3"/>
        <path d="M48.4 22 h6.6" stroke-width="3"/>

        <!-- 叶片：两条对称弧线合围成柳叶形（长约 35~42、宽约 11~13），大叶再补一条叶脉。
             宽度不能太窄，否则缩小后整丛叶子会糊成羽毛状 -->
        <g stroke-width="2.1">
          <!-- 竿顶一簇 -->
          <path d="M49 14 C 34 6, 20 0, 8 2 C 22 16, 36 22, 49 14 Z"
                fill="currentColor" fill-opacity="0.24"/>
          <path d="M49 14 C 34 11, 20 6, 9.6 3.4" stroke-opacity="0.72" stroke-width="1.2"/>
          <path d="M50 20 C 64 12, 80 10, 94 14 C 80 26, 64 28, 50 20 Z"
                fill="currentColor" fill-opacity="0.24"/>
          <path d="M50 20 C 64 15, 79 12, 91.4 14.2" stroke-opacity="0.72" stroke-width="1.2"/>
          <path d="M49 26 C 40 20, 28 18, 18 22 C 28 34, 40 36, 49 26 Z"
                fill="currentColor" fill-opacity="0.24"/>

          <!-- 中段两片 -->
          <path d="M48 68 C 34 60, 20 56, 12 60 C 24 74, 36 76, 48 68 Z"
                fill="currentColor" fill-opacity="0.24"/>
          <path d="M48 68 C 34 64, 22 60.5, 13.6 60.6" stroke-opacity="0.72" stroke-width="1.2"/>
          <path d="M49 74 C 62 66, 76 64, 88 70 C 76 80, 62 82, 49 74 Z"
                fill="currentColor" fill-opacity="0.24"/>

          <!-- 下段一片 -->
          <path d="M48 92 C 34 86, 22 84, 14 88 C 26 98, 36 100, 48 92 Z"
                fill="currentColor" fill-opacity="0.24"/>
        </g>
      </g>
    </symbol>

    <!-- 银杏叶：成都的秋天。扇形叶 + 顶部凹口 + 放射状叶脉 -->
    <symbol id="i-ginkgo" viewBox="0 0 80 80">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- 叶柄 -->
        <path d="M40 78 C 40.6 68, 40.4 61, 40 54" stroke-width="2.4"/>
        <!-- 叶片：左缘上扬 → 顶部凹口 → 右缘落下 → 收拢回叶柄 -->
        <path d="M40 54
                 C 30 46, 16 40, 10 30
                 C 6 20, 14 10, 24 11
                 C 32 12, 38 18, 40 24
                 C 42 18, 48 12, 56 11
                 C 66 10, 74 20, 70 30
                 C 64 40, 50 46, 40 54 Z"
              stroke-width="2.5" fill="currentColor" fill-opacity="0.15"/>
        <!-- 放射叶脉：太淡整片会糊掉，所以比轮廓稍实一点 -->
        <g stroke-width="1.4" stroke-opacity="0.78">
          <path d="M40 54 C 32 44, 20 34, 12 29"/>
          <path d="M40 54 C 36 42, 30 26, 25 13.5"/>
          <path d="M40 54 C 40.2 42, 40 30, 40 20"/>
          <path d="M40 54 C 44 42, 50 26, 55 13.5"/>
          <path d="M40 54 C 48 44, 60 34, 68 29"/>
        </g>
      </g>
    </symbol>

    <!-- 盖碗茶：成都的闲。茶船 / 茶碗 / 茶盖三段式 -->
    <symbol id="i-tea" viewBox="0 0 80 80">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- 茶船 -->
        <ellipse cx="40" cy="62" rx="27" ry="7.6" stroke-width="2.3"/>
        <path d="M13.4 62.6 C 15.4 69.6, 26 72.6, 40 72.6 C 54 72.6, 64.6 69.6, 66.6 62.6" stroke-width="2.3"/>
        <!-- 碗身 -->
        <path d="M21.6 34.5 C 21.8 50, 28.6 59.4, 40 60.4 C 51.4 59.4, 58.2 50, 58.4 34.5" stroke-width="2.5"/>
        <!-- 碗口 -->
        <ellipse cx="40" cy="34.5" rx="18.4" ry="5.4" stroke-width="2.3"/>
        <!-- 碗身刻线 -->
        <path d="M24.4 43 C 29 46.6, 51 46.6, 55.6 43" stroke-width="1.1" stroke-opacity="0.5"/>
        <!-- 茶盖：穹顶 + 盖钮 -->
        <path d="M25.6 30.4 C 27.4 20.6, 52.6 20.6, 54.4 30.4" stroke-width="2.3"/>
        <ellipse cx="40" cy="30.4" rx="14.4" ry="4.2" stroke-width="2.1"/>
        <ellipse cx="40" cy="19.6" rx="4.2" ry="3" stroke-width="2.1"/>
      </g>
    </symbol>

    <!-- 川剧脸谱：靠"加粗的对称纹样 + 实心色块"立住脸谱感，而不是细线描个面具轮廓。
         三处关键：① 额心火焰纹实心 ② 眉毛加粗到 4.5 并大幅外扬、末端下压 ③ 眼窝用粗描边椭圆做出彩绘眼圈 -->
    <symbol id="i-opera" viewBox="0 0 80 80">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- 脸廓：额头饱满、下巴收窄 -->
        <path d="M40 4 C 22 4, 12 18, 12 35 C 12 56, 25 74, 40 77 C 55 74, 68 56, 68 35 C 68 18, 58 4, 40 4 Z"
              stroke-width="2.6"/>

        <!-- 额心火焰纹（实心） -->
        <path d="M40 9 C 35.5 15, 32.5 19.5, 35.5 23.5 C 37.6 26.4, 40 24.6, 40 22
                 C 40 24.6, 42.4 26.4, 44.5 23.5 C 47.5 19.5, 44.5 15, 40 9 Z"
              fill="currentColor" fill-opacity="0.88" stroke-width="1.6"/>

        <!-- 上扬眉：脸谱最醒目的一笔。末端刻意下压到 y=25，
             好和下方眼窝上缘（y≈28）在视觉上连成一体，而不是两条孤立的弧 -->
        <path d="M36.5 31 C 29 24, 20 21, 11.5 25" stroke-width="4.5"/>
        <path d="M43.5 31 C 51 24, 60 21, 68.5 25" stroke-width="4.5"/>

        <!-- 眼窝：粗描边 + 淡填充，做出"彩绘眼圈"的体积感 -->
        <ellipse cx="23" cy="35" rx="10" ry="7" transform="rotate(-14 23 35)"
                 stroke-width="3.2" fill="currentColor" fill-opacity="0.3"/>
        <ellipse cx="57" cy="35" rx="10" ry="7" transform="rotate(14 57 35)"
                 stroke-width="3.2" fill="currentColor" fill-opacity="0.3"/>

        <!-- 眼：实心上挑 -->
        <ellipse cx="23.5" cy="35.5" rx="3.8" ry="2.7" transform="rotate(-14 23.5 35.5)"
                 fill="currentColor" stroke-width="1.2"/>
        <ellipse cx="56.5" cy="35.5" rx="3.8" ry="2.7" transform="rotate(14 56.5 35.5)"
                 fill="currentColor" stroke-width="1.2"/>

        <!-- 颊纹：自眼角向外下方勾出的对称曲线 -->
        <path d="M14 43 C 12 49, 13 55, 17 59" stroke-width="2.6"/>
        <path d="M66 43 C 68 49, 67 55, 63 59" stroke-width="2.6"/>

        <!-- 鼻梁与鼻翼 -->
        <path d="M40 30 V 52" stroke-width="2.4"/>
        <path d="M40 52 C 36.5 55.5, 34.5 58, 33.5 60.5" stroke-width="2.2"/>
        <path d="M40 52 C 43.5 55.5, 45.5 58, 46.5 60.5" stroke-width="2.2"/>

        <!-- 嘴 -->
        <path d="M30 65 C 35.5 70, 44.5 70, 50 65" stroke-width="2.4"/>
      </g>
    </symbol>

    <!-- ============ 功能性小图标（24×24 网格，统一 1.8 线宽）============ -->
    <symbol id="i-bulb" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 17.6 C 6.7 16.2, 5.2 13.8, 5.2 11.2 C 5.2 7.4, 8.2 4.4, 12 4.4 C 15.8 4.4, 18.8 7.4, 18.8 11.2 C 18.8 13.8, 17.3 16.2, 15 17.6 L 15 19.4 L 9 19.4 Z"/>
        <path d="M9.8 21.6 h4.4"/>
        <path d="M12 8.4 V 13.6"/>
        <path d="M9.9 11.5 L 12 13.6 L 14.1 11.5"/>
      </g>
    </symbol>

    <symbol id="i-restart" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 12 A 8.2 8.2 0 1 1 17.3 6.1"/>
        <path d="M20.6 2.8 V 6.9 H 16.5"/>
      </g>
    </symbol>

    <symbol id="i-lock" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.8" y="10.4" width="14.4" height="9.8" rx="2.4"/>
        <path d="M8.2 10.4 V 7.6 A 3.8 3.8 0 0 1 15.8 7.6 V 10.4"/>
        <path d="M12 14 v2.4"/>
      </g>
    </symbol>

    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5.2 12.4 L 10 17.2 L 18.8 6.8" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 五角星：结算画面的星级评价。
         坐标是按每 72° 一个顶点算出来的（外接半径 10、内接半径 4.2，中心 12,12），
         不是随手凑的，所以五条边等长、看着才正。
         这里刻意不写 fill/stroke —— 让样式从外层 <svg> 继承进来。
         因为 <use> 引用的是 shadow tree，外部 CSS 选不中里面的 path，
         只有"继承"这一条路能让同一个 symbol 既渲成实心星、又渲成空心星。 -->
    <symbol id="i-star" viewBox="0 0 24 24">
      <path d="M12 2 L14.47 8.6 L21.51 8.91 L15.99 13.3 L17.88 20.09
               L12 16.2 L6.12 20.09 L8.01 13.3 L2.49 8.91 L9.53 8.6 Z"/>
    </symbol>

    <symbol id="i-leaf" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 4 C 10 4, 4 9.6, 4 15.4 C 4 17.6, 4.8 19.2, 5.8 20 C 6.6 16.6, 9 13.6, 12.4 11.6"
              stroke-width="1.8"/>
        <path d="M20 4 C 20.6 12.6, 15.4 18.4, 9.4 18.4 C 8 18.4, 6.8 18, 5.8 17.4"
              stroke-width="1.8" fill="currentColor" fill-opacity="0.16"/>
      </g>
    </symbol>

    <!-- 音效开关：喇叭（开）/ 喇叭划掉（关） -->
    <symbol id="i-sound" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.4 h3.4 L12 5.4 v13.2 L7.4 14.6 H4 Z"/>
        <path d="M15.4 9.2 a4 4 0 0 1 0 5.6"/>
        <path d="M18.1 6.5 a7.7 7.7 0 0 1 0 11"/>
      </g>
    </symbol>

    <symbol id="i-mute" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.4 h3.4 L12 5.4 v13.2 L7.4 14.6 H4 Z"/>
        <path d="M16 9.6 L21 14.4"/>
        <path d="M21 9.6 L16 14.4"/>
      </g>
    </symbol>

  </defs>
</svg>

<!-- 背景装饰层：网格 + 光晕 + 手绘竹枝银杏，全部 aria-hidden，不参与交互 -->
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-deco" aria-hidden="true">
  <svg class="deco deco-bamboo-l" viewBox="0 0 100 140"><use href="#i-bamboo"/></svg>
  <svg class="deco deco-ginkgo-r" viewBox="0 0 80 80"><use href="#i-ginkgo"/></svg>
  <svg class="deco deco-ginkgo-r2" viewBox="0 0 80 80"><use href="#i-ginkgo"/></svg>
  <svg class="deco deco-leaf-tr" viewBox="0 0 24 24"><use href="#i-leaf"/></svg>
</div>

<div class="app">

  <!-- ======================= 顶栏 ======================= -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-panda"/></svg>
      </div>
      <div class="brand-text">
        <h1>成都地图拼图</h1>
        <p>拖动碎片，拼出成都的 20 个区县</p>
      </div>
    </div>
    <div class="topbar-right">
      <nav class="level-tabs" id="levelTabs" aria-label="关卡选择"></nav>

      <!-- 音效开关：两个图标叠在同一格，由 aria-pressed 决定显示哪个 -->
      <button class="sound-btn" id="soundBtn" type="button"
              aria-label="音效开关" aria-pressed="true">
        <svg class="sound-ico sound-on" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sound"/></svg>
        <svg class="sound-ico sound-off" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mute"/></svg>
      </button>

      <!-- 配色主题切换：三个色点分别是该主题的主色 -->
      <div class="theme-switch" id="themeSwitch" role="group" aria-label="配色主题">
        <button type="button" class="theme-dot" data-theme="jade"
                title="青绿竹韵" aria-label="青绿竹韵"></button>
        <button type="button" class="theme-dot" data-theme="ginkgo"
                title="银杏暖秋" aria-label="银杏暖秋"></button>
        <button type="button" class="theme-dot" data-theme="shu"
                title="蜀锦朱砂" aria-label="蜀锦朱砂"></button>
      </div>
    </div>
  </header>

  <!-- ======================= 主舞台 ======================= -->
  <main class="stage">

    <!-- 左侧：地图 + 碎片托盘 -->
    <section class="board-column">

      <div class="board" id="board">
        <svg class="map" id="map" preserveAspectRatio="xMidYMid meet" role="img"
             aria-label="成都市行政区划拼图板">
          <defs id="mapDefs"></defs>
          <!-- 底图：全部区县的浅色轮廓，给玩家一个"地图纸"的参照 -->
          <g class="layer layer-base" id="layerBase"></g>
          <!-- 凹槽：本关待拼位置的虚线轮廓 -->
          <g class="layer layer-slots" id="layerSlots"></g>
          <!-- 已拼好的彩色区块 -->
          <g class="layer layer-placed" id="layerPlaced"></g>
        </svg>

        <!-- 浮动提示：放对了 / 放错了 -->
        <div class="board-toast" id="boardToast" aria-live="polite"></div>

        <!-- 关卡开场说明，2.5 秒后自动淡出 -->
        <div class="board-intro" id="boardIntro"></div>

        <!-- 角落水印：极淡的银杏叶，纯装饰 -->
        <svg class="board-mark" viewBox="0 0 80 80" aria-hidden="true"><use href="#i-ginkgo"/></svg>
      </div>

      <div class="tray-panel">
        <div class="tray-head">
          <span class="tray-title">
            <svg class="tray-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-leaf"/></svg>碎片托盘
          </span>
          <span class="tray-hint" id="trayHint">拖动碎片到地图上的虚线位置</span>
          <span class="tray-count" id="trayCount"></span>
        </div>
        <div class="tray" id="tray" role="group" aria-label="待拼装的碎片"></div>
      </div>

    </section>

    <!-- 右侧：进度 + 讲解 -->
    <aside class="sidebar">

      <div class="card progress-card">
        <div class="progress-head">
          <span class="progress-label">本关进度</span>
          <span class="progress-value"><b id="statDone">0</b><i>/</i><span id="statTotal">5</span></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="stat-row">
          <div class="stat"><span class="stat-k">用时</span><span class="stat-v" id="statTime">00:00</span></div>
          <div class="stat"><span class="stat-k">尝试</span><span class="stat-v" id="statTries">0</span></div>
          <div class="stat"><span class="stat-k">提示</span><span class="stat-v" id="statHints">0</span></div>
        </div>
      </div>

      <!-- aria-live：拼对之后这里的内容会被屏幕阅读器读出来 -->
      <div class="card info-card" id="infoCard" aria-live="polite"></div>

      <div class="actions">
        <button class="btn btn-ghost" id="btnHint" type="button">
          <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bulb"/></svg>提示
        </button>
        <button class="btn btn-ghost" id="btnRestart" type="button">
          <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-restart"/></svg>重开本关
        </button>
      </div>

    </aside>

  </main>
</div>

<!-- ======================= 开场欢迎动画 =======================
     覆盖整屏，展示五个成都元素（熊猫 / 竹子 / 银杏 / 脸谱 / 盖碗茶），
     依次弹入后浮出标题与「开始探索」。同一次会话内不会重复出现。 -->
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="欢迎来到成都地图拼图" hidden>
  <div class="intro-inner">
    <div class="intro-marks" aria-hidden="true">
      <svg class="intro-mark" viewBox="0 0 64 64"><use href="#i-panda"/></svg>
      <svg class="intro-mark" viewBox="0 0 100 140"><use href="#i-bamboo"/></svg>
      <svg class="intro-mark" viewBox="0 0 80 80"><use href="#i-ginkgo"/></svg>
      <svg class="intro-mark" viewBox="0 0 80 80"><use href="#i-opera"/></svg>
      <svg class="intro-mark" viewBox="0 0 80 80"><use href="#i-tea"/></svg>
    </div>
    <p class="intro-kicker">CHENGDU · 20 个区县</p>
    <h1 class="intro-title">成都地图拼图</h1>
    <p class="intro-sub">拖动碎片，把它们放回地图上本来的位置</p>
    <button class="btn btn-primary intro-btn" id="introStart" type="button">开始探索</button>
    <p class="intro-skip">点任意位置也可以直接开始</p>
  </div>
</div>

<!-- ======================= 通关结算画面 ======================= -->
<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-icon" id="modalIcon" aria-hidden="true">
      <svg viewBox="0 0 80 80"><use href="#i-tea"/></svg>
    </div>
    <p class="modal-kicker" id="modalKicker"></p>
    <h2 id="modalTitle"></h2>
    <div class="modal-stars" id="modalStars" aria-hidden="true"></div>
    <p class="modal-text" id="modalText"></p>
    <div class="modal-stats" id="modalStats"></div>
    <div class="modal-chips" id="modalChips"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- 拖拽时跟随指针的幽灵层（JS 动态创建，这里先占个位说明结构） -->
<!-- <div class="drag-ghost"><svg viewBox="..."><path d="..."/></svg></div> -->

<!-- 加载顺序不可调换：
     registry 是一份很轻的元信息（谁是谁的父级、脚本在哪），一次性全量加载
     → loader 在"用户选中某张地图"时按 registry 动态注入该地图的脚本
       （用 <script> 注入而不是 fetch，所以 file:// 双击打开也能用）
     → geomap 提供投影工具 → engine 通用引擎 → game 启动
     于是地图数量再多，首屏也不会变重，"双击即玩"的零依赖体验照旧 -->
<script src="js/maps/registry.js"></script>
<script src="js/maps/loader.js"></script>
<script src="js/geomap.js"></script>
<script src="js/engine.js"></script>
<script src="js/game.js"></script>
</body>
</html>
