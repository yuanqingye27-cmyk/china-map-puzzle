<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>EXP · 极小碎片拖拽 / 启动闪烁探针</title>
<style>
  body { font: 13px/1.5 -apple-system, sans-serif; margin: 0; padding: 8px; }
  /* 被测 iframe 必须留在正常文档流里，理由见 map-smoke.html 顶部注释 */
  iframe { width: 1600px; height: 1000px; border: 0; display: block; background: #fff; }
  iframe.probe { width: 900px; height: 700px; border: 1px solid #ccc; margin-top: 12px; }
  #result { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  #frames { position: relative; z-index: 0; }
</style>
</head>
<body>
<form id="rform" method="post" target="rsink" style="display:none"></form>
<iframe name="rsink" style="display:none" title="report sink"></iframe>

<div id="frames"></div>
<pre id="result">探针运行中…</pre>

<script src="../js/maps/registry.js"></script>
<script>
(function () {
  'use strict';
  const PORT = new URLSearchParams(location.search).get('port');
  /* 探针参数：?port=9451&map=china&level=5&targets=820000,810000,710000
   *   level（1 基，默认 1）—— 目标碎片在第几关。中国图的港澳台在第 5 关，
   *   所以"能拖出来吗"这事必须在那一关上量，量第 1 关等于没量。 */
  const MAP = new URLSearchParams(location.search).get('map') || 'china';
  const LEVEL = Math.max(1, Number(new URLSearchParams(location.search).get('level')) || 1);
  const TARGETS = (new URLSearchParams(location.search).get('targets') || '820000,810000,710000')
    .split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  /* ?hold=1：拖到目标后不松手，留给截图（见 exp-run.js 的 --shot） */
  const HOLD = new URLSearchParams(location.search).get('hold') === '1';

  const out = [];
  let reported = false;
  const sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  function line(s) { out.push(s); }

  function report(payload) {
    if (reported) return;
    reported = true;
    document.getElementById('result').textContent = out.join('\n');
    try {
      const form = document.getElementById('rform');
      form.action = 'http://127.0.0.1:' + PORT + '/report';
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'd';
      input.value = JSON.stringify({ log: out.join('\n') });
      form.appendChild(input);
      form.submit();
    } catch (e) { /* 上报失败就算了 */ }
  }

  async function waitFor(fn, timeoutMs, label) {
    const deadline = Date.now() + (timeoutMs || 10000);
    for (;;) {
      let v = null;
      try { v = fn(); } catch (e) { v = null; }
      if (v) return v;
      if (Date.now() > deadline) throw new Error('等待超时：' + (label || '条件未满足'));
      await sleep(50);
    }
  }

  /* 等视图停止动画 —— 否则 getScreenCTM 每帧都在变，量出来的坐标没意义 */
  async function waitViewStable(D) {
    let prev = null;
    for (let i = 0; i < 80; i++) {
      const el = D.getElementById('map');
      const m = el && el.getScreenCTM ? el.getScreenCTM() : null;
      const key = m ? [m.a, m.d, m.e, m.f].join(',') : 'null';
      if (prev === key) return true;
      prev = key;
      await sleep(100);
    }
    return false;
  }

  function newFrame(cls) {
    const f = document.createElement('iframe');
    if (cls) f.className = cls;
    document.getElementById('frames').appendChild(f);
    return f;
  }

  /* 在凹槽形状内部找一个确实落在多边形里的点（做法与 map-smoke.html 一致） */
  function insidePointOf(W, D, adcode) {
    const pathEl = D.querySelector('.slot[data-adcode="' + adcode + '"] path');
    if (!pathEl) return null;
    const bb = pathEl.getBBox();
    const ctm = pathEl.getScreenCTM();
    const pt = pathEl.ownerSVGElement.createSVGPoint();
    const hit = function (dx, dy) {
      pt.x = bb.x + bb.width * dx;
      pt.y = bb.y + bb.height * dy;
      if (!pathEl.isPointInFill(pt)) return null;
      const s = pt.matrixTransform(ctm);
      return { x: s.x, y: s.y };
    };
    const center = hit(0.5, 0.5);
    if (center) return center;
    const N = 41;
    for (let iy = 1; iy < N; iy++) {
      for (let ix = 1; ix < N; ix++) {
        const p = hit(ix / N, iy / N);
        if (p) return p;
      }
    }
    return null;
  }

  /* 一次真实拖拽（升到 document，与现有测试同款），并等它结算完 */
  async function dragOnce(W, D, adcode, to, steps) {
    steps = steps || 6;
    const triesBefore = (W.__ENGINE__ && W.__ENGINE__.getState().tries) || 0;
    const piece = D.querySelector('.piece[data-adcode="' + adcode + '"]');
    if (!piece) return { ok: false, why: '托盘里没有 ' + adcode };
    const r = piece.getBoundingClientRect();
    const from = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    const fire = function (target, type, x, y) {
      target.dispatchEvent(new W.PointerEvent(type, {
        bubbles: true, cancelable: true, composed: true,
        clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse',
        isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1,
      }));
    };
    fire(piece, 'pointerdown', from.x, from.y);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      fire(D, 'pointermove', from.x + (to.x - from.x) * t, from.y + (to.y - from.y) * t);
      await sleep(24);
    }
    fire(D, 'pointerup', to.x, to.y);
    try {
      await waitFor(function () {
        const st = W.__ENGINE__ ? W.__ENGINE__.getState() : null;
        return st && st.tries > triesBefore && !D.querySelector('.drag-ghost');
      }, 5000, '拖拽结算');
    } catch (e) { /* 超时由调用方判定 */ }
    const st2 = W.__ENGINE__ ? W.__ENGINE__.getState() : null;
    return {
      ok: !!(st2 && Array.from(st2.placed).map(String).indexOf(String(adcode)) >= 0),
      state: st2,
    };
  }

  /* 把当前这一关拼完（用真实拖拽），返回统计 */
  async function solveCurrentLevel(W, D) {
    const st0 = W.__ENGINE__.getState();
    const slots = [].slice.call(D.querySelectorAll('.slot')).map(function (g) {
      return String(g.dataset.adcode);
    });
    let solved = 0;
    const failed = [];
    for (const adcode of slots) {
      if (W.__ENGINE__.getState().solved) break;
      const to = insidePointOf(W, D, adcode);
      if (!to) { failed.push(adcode + '(找不到落点)'); continue; }
      const res = await dragOnce(W, D, adcode, to);
      if (res.ok) solved++;
      else failed.push(adcode);
    }
    return {
      levelId: st0.levelId,
      total: slots.length,
      solved: solved,
      failed: failed,
      allSolved: !!W.__ENGINE__.getState().solved,
    };
  }

  /* ============ 场景 1：无 ?map= 参数打开，观察品牌文案闪烁 ============ */
  async function scenarioDefault() {
    line('\n【场景 1】无 ?map= 参数打开（默认地图 + 闪烁时序观察）');
    /* 【为什么要先建空 iframe 再设 src】上一次探针是在 iframe 的 load 事件里才挂
     * MutationObserver —— 那时 page 已经跑完脚本，"加载中"那条其实没被观测到。
     * 改成：先建一个空 iframe（about:blank，同源）→ 先把观察器挂到它的 document →
     * 再设 src 触发导航。这样连"解析 index.html 时的初始状态"都能采到。 */
    const frame = newFrame();
    const seq = [];
    let observer = null;

    function sample(tag) {
      let D2 = null;
      try { D2 = frame.contentDocument; } catch (e) { D2 = null; }
      if (!D2 || !D2.documentElement) return;
      const t = D2.getElementById ? D2.getElementById('brandTitle') : null;
      const s = D2.getElementById ? D2.getElementById('brandSub') : null;
      const last = seq[seq.length - 1];
      const rec = {
        tag: tag,
        t: Date.now(),
        ready: D2.documentElement.getAttribute('data-map-ready'),
        title: D2.title || null,
        brand: t ? t.textContent : null,
        sub: s ? s.textContent : null,
      };
      /* 只记录有变化的采样，避免刷屏 */
      if (last && last.title === rec.title && last.brand === rec.brand &&
          last.sub === rec.sub && last.ready === rec.ready) return;
      seq.push(rec);
    }

    /* 空 iframe 已经同源可读，先把观察器挂上 */
    frame.src = 'about:blank';
    await new Promise(function (r) { frame.addEventListener('load', r, { once: true }); });
    try {
      observer = new MutationObserver(function () { sample('mutation'); });
      observer.observe(frame.contentDocument.documentElement, {
        subtree: true, childList: true, characterData: true, attributes: true,
      });
    } catch (e) { line('  · 观察器挂载失败：' + e.message); }

    const t0 = Date.now();
    frame.src = '../index.html';
    sample('设 src 后立即');

    let ready = null;
    try {
      ready = await waitFor(function () {
        const D2 = frame.contentDocument;
        const v = D2 && D2.documentElement.getAttribute('data-map-ready');
        sample('轮询');
        return v;
      }, 40000, '默认地图就绪');
    } catch (e) {
      line('  ✘ 默认地图没就绪：' + e.message);
      return;
    }
    await sleep(600);
    sample('就绪后');
    if (observer) observer.disconnect();

    line('  · data-map-ready = ' + ready);
    line('  · 文案变化采样（共 ' + seq.length + ' 条）：');
    seq.forEach(function (s) {
      line('      [' + String(s.t - t0).padStart(5) + 'ms] ready=' + JSON.stringify(s.ready) +
        ' title=' + JSON.stringify(s.title));
      if (s.brand) line('                brand=' + JSON.stringify(s.brand));
      if (s.sub) line('                sub  =' + JSON.stringify(s.sub));
    });

    const chengduFrames = seq.filter(function (s) {
      return (s.brand && s.brand.indexOf('成都') >= 0) ||
             (s.title && s.title.indexOf('成都') >= 0) ||
             (s.sub && s.sub.indexOf('成都') >= 0);
    });
    line('  · 出现「成都」的采样数 = ' + chengduFrames.length +
      (chengduFrames.length
        ? '  ← 默认地图就是成都，这是"内容"而不是"闪烁 bug"'
        : '（一次都没出现 ✅）'));

    /* 顺带量一下中国图首屏：视图框 vs 全国 bbox，看是否"放大到局部" */
    const W = frame.contentWindow;
    const D = frame.contentDocument;
    const mapEl = D.getElementById('map');
    line('  · 中国图首屏 viewBox = ' + (mapEl ? mapEl.getAttribute('viewBox') : 'null'));
    try {
      const base = D.getElementById('layerBase');
      const p0 = base && base.querySelector('path');
      if (p0) {
        const bb = p0.getBBox();
        line('  · 底图 bbox = ' + JSON.stringify({
          x: Math.round(bb.x), y: Math.round(bb.y),
          w: Math.round(bb.width), h: Math.round(bb.height),
        }));
      }
    } catch (e) { line('  · 底图 bbox 取不到：' + e.message); }
    line('  · 关卡数 = ' + ((W.MAP_PACKAGES && W.MAP_PACKAGES[MAP] && W.MAP_PACKAGES[MAP].levels) || []).length);
  }

  /* ============ 场景 2：?level= 参数是否被识别 ============ */
  async function scenarioLevelParam() {
    line('\n【场景 2】?level=2 打开（默认地图是否会因 level 参数变化）');
    const frame = newFrame();
    frame.src = '../index.html?level=2';
    let ready = null;
    try {
      ready = await waitFor(function () {
        return frame.contentDocument.documentElement.getAttribute('data-map-ready');
      }, 40000, '?level=2 就绪');
    } catch (e) {
      line('  ✘ 没就绪：' + e.message);
      return;
    }
    line('  · data-map-ready = ' + ready + '（若等于默认地图 → ?level= 不改变地图选择）');
  }

  /* ============ 场景 3：极小碎片几何 + 真实拖拽 ============ */
  async function scenarioTiny() {
    line('\n【场景 3】' + MAP + ' 图上的极小碎片：几何 + 真实拖拽');

    const frame = newFrame();
    frame.src = '../index.html?map=' + encodeURIComponent(MAP);
    const pageErrors = [];
    try {
      await new Promise(function (r) { frame.addEventListener('load', r, { once: true }); });
      const W0 = frame.contentWindow;
      W0.addEventListener('error', function (e) { pageErrors.push(e.message); });
    } catch (e) { /* 下面按超时处理 */ }

    let ready = null;
    try {
      ready = await waitFor(function () {
        return frame.contentDocument.documentElement.getAttribute('data-map-ready');
      }, 40000, MAP + ' 就绪');
    } catch (e) {
      line('  ✘ ' + MAP + ' 没就绪：' + e.message);
      return;
    }
    /* 用 let：下面解锁第 5 关时会 reload iframe，reload 后要重新取引用 */
    let W = frame.contentWindow;
    let D = frame.contentDocument;
    line('  · 就绪标记 = ' + ready + '，页面错误 = ' + (pageErrors.length || '无'));

    /* 开场动画盖住整页，先点掉（同一次会话只播一次） */
    const intro = D.getElementById('intro');
    if (intro && !intro.hidden) { intro.click(); await sleep(700); }

    /* --- 跳到目标关卡：真实打通前几关，再点标签 ---
     * 【为什么不用"注入存档"解锁】先试过写 localStorage 再 reload，实测标签仍然禁用，
     * 说明 file:// 下存档没被读到（原因未定位，不想在探针里再猜一层）。
     * 改成老实打通前面的关卡：慢几十秒，但走的是**真实玩家路径**，
     * 顺带还能回答"真人能不能过关"这个问题 —— 对 P0-1 的验收更有价值。 */
    let tabs = [].slice.call(D.querySelectorAll('.level-tab'));
    line('  · 关卡标签数 = ' + tabs.length +
      '，禁用 = ' + tabs.filter(function (b) { return b.disabled; }).length);
    if (LEVEL > 1) {
      for (let guard = 0; guard < 20; guard++) {
        const st = W.__ENGINE__ ? W.__ENGINE__.getState() : null;
        if (!st) break;
        if (st.levelIndex === LEVEL - 1) break;
        if (st.levelIndex > LEVEL - 1) break;
        const t = Date.now();
        const res = await solveCurrentLevel(W, D);
        line('  · 通关 ' + st.levelId + '：' + res.solved + '/' + res.total +
          ' 块，全清 = ' + res.allSolved + '，耗时 ' + ((Date.now() - t) / 1000).toFixed(1) + 's' +
          (res.failed.length ? '，失败块 ' + res.failed.join('、') : ''));
        if (!res.allSolved) {
          line('  ✘ 拼不完这一关，后面的关卡进不去 → 停止解锁尝试');
          break;
        }
        await sleep(700);
        /* 通关后引擎把 unlocked 往后推一格；点"当前关"标签即可继续 */
        const cur = W.__ENGINE__.getState();
        if (cur.levelIndex === LEVEL - 1) break;
        const tabs2 = [].slice.call(D.querySelectorAll('.level-tab'));
        const next = tabs2[cur.levelIndex + 1];
        if (next && !next.disabled) {
          next.click();
          await sleep(600);
          await waitViewStable(D);
        } else {
          line('  ✘ 下一关标签不可用，停在这里（levelIndex=' + cur.levelIndex + '）');
          break;
        }
      }
    }

    /* 取一次最终引用（可能有重载，也可能没有）*/
    D = frame.contentDocument;
    W = frame.contentWindow;
    tabs = [].slice.call(D.querySelectorAll('.level-tab'));
    line('  · 解锁尝试后：共 ' + tabs.length +
      ' 个标签，禁用 ' + tabs.filter(function (b) { return b.disabled; }).length);
    if (LEVEL > 1) {
      const cur = W.__ENGINE__ ? W.__ENGINE__.getState() : null;
      line('  · 当前 levelIndex = ' + (cur ? cur.levelIndex : '?') +
        '（期望 ' + (LEVEL - 1) + '），levelId = ' + (cur ? cur.levelId : '?'));
      const tab = tabs[LEVEL - 1];
      if (tab && !tab.disabled && cur && cur.levelIndex !== LEVEL - 1) {
        tab.click();
        await sleep(600);
        await waitViewStable(D);
        const st = W.__ENGINE__ ? W.__ENGINE__.getState() : null;
        line('  · 已点击第 ' + LEVEL + ' 关标签，levelIndex = ' + (st ? st.levelIndex : '?'));
      }
    }
    await waitViewStable(D);

    const mapEl = D.getElementById('map');
    const ctmInv = mapEl.getScreenCTM().inverse();

    /* --- 先把"当前屏上所有凹槽"按屏幕面积排序，找真正的极小碎片 --- */
    const all = [];
    D.querySelectorAll('.slot').forEach(function (g) {
      const p = g.querySelector('path');
      if (!p) return;
      const bb = p.getBBox();
      const m = p.getScreenCTM();
      /* 屏幕面积 = 地图坐标面积 × CTM 的缩放平方（CTM 无旋转/镜像时成立） */
      const scale = Math.sqrt(Math.abs(m.a * m.d - m.b * m.c));
      const d = p.getAttribute('d') || '';
      let pts = 0;
      try { pts = (d.match(/[ML]/g) || []).length; } catch (e) { pts = 0; }
      all.push({
        adcode: String(g.dataset.adcode),
        bbox: bb,
        ctmScale: scale,
        screenW: bb.width * scale,
        screenH: bb.height * scale,
        screenArea: bb.width * bb.height * scale * scale,
        vertices: pts,
      });
    });
    all.sort(function (a, b) { return a.screenArea - b.screenArea; });
    line('  · 当前屏上凹槽数 = ' + all.length);
    line('  · 屏幕面积最小的 8 个（像素²）：');
    all.slice(0, 8).forEach(function (s, i) {
      line('      ' + (i + 1) + '. ' + s.adcode +
        '  屏幕 ' + s.screenW.toFixed(1) + '×' + s.screenH.toFixed(1) + 'px' +
        '  面积 ' + Math.round(s.screenArea) + 'px²' +
        '  顶点数 ' + s.vertices);
    });
    const totalArea = all.reduce(function (a, b) { return a + b.screenArea; }, 0);
    line('  · 面积占比阈值参考：全图屏幕面积合计 = ' + Math.round(totalArea) + 'px²');

    /* --- 逐目标：几何 → 遮挡估算 → 真实拖拽 --- */
    for (const adcode of TARGETS) {
      line('\n  ── 目标 ' + adcode + ' ──');
      const slotG = D.querySelector('.slot[data-adcode="' + adcode + '"]');
      const pieceEl = D.querySelector('.piece[data-adcode="' + adcode + '"]');
      if (!slotG) { line('     ✘ 当前关卡里没有这个凹槽（可能不在第一关）'); continue; }
      if (!pieceEl) { line('     ✘ 托盘里没有这块碎片'); continue; }

      const pathEl = slotG.querySelector('path');
      const sbb = pathEl.getBBox();
      const sm = pathEl.getScreenCTM();
      const scale = Math.sqrt(Math.abs(sm.a * sm.d - sm.b * sm.c));
      const sW = sbb.width * scale;
      const sH = sbb.height * scale;
      const pr = pieceEl.getBoundingClientRect();
      line('     凹槽屏幕尺寸 ' + sW.toFixed(1) + '×' + sH.toFixed(1) + 'px' +
        '，碎片屏幕尺寸 ' + pr.width.toFixed(1) + '×' + pr.height.toFixed(1) + 'px');

      /* 找一个确实落在多边形内部的落点：先试形心，再用加密网格 */
      let drop = null;
      const pt = mapEl.createSVGPoint();
      function tryPoint(fx, fy) {
        pt.x = sbb.x + sbb.width * fx;
        pt.y = sbb.y + sbb.height * fy;
        if (!pathEl.isPointInFill(pt)) return null;
        const sp = pt.matrixTransform(sm);
        return { x: sp.x, y: sp.y };
      }
      drop = tryPoint(0.5, 0.5);
      if (!drop) {
        const N = 41;
        for (let iy = 1; iy < N && !drop; iy++) {
          for (let ix = 1; ix < N && !drop; ix++) drop = tryPoint(ix / N, iy / N);
        }
      }
      if (!drop) { line('     ✘ 凹槽内找不到落点（形状太碎？）'); continue; }
      line('     落点（屏幕坐标）= (' + drop.x.toFixed(1) + ', ' + drop.y.toFixed(1) + ')');

      /* 遮挡估算：把碎片按"指针在落点"摆放，量它的矩形压住多少凹槽内的采样点 */
      const samples = [];
      for (let i = 0; i < 41; i++) {
        for (let j = 0; j < 41; j++) {
          const p = tryPoint((i + 0.5) / 41, (j + 0.5) / 41);
          if (p) samples.push(p);
        }
      }
      const rectLike = {
        left: drop.x - pr.width / 2, top: drop.y - pr.height / 2,
        right: drop.x + pr.width / 2, bottom: drop.y + pr.height / 2,
      };
      let covered = 0;
      samples.forEach(function (s) {
        if (s.x >= rectLike.left && s.x <= rectLike.right &&
            s.y >= rectLike.top && s.y <= rectLike.bottom) covered++;
      });
      const cov = samples.length ? covered / samples.length : 0;
      line('     凹槽内采样点 ' + samples.length + ' 个，被碎片矩形压住 ' + covered +
        ' 个 → 遮挡率 ' + (cov * 100).toFixed(1) + '%');

      /* 用引擎自己的公式复算：这个落点会解析到哪个凹槽？ */
      const mp = new W.DOMPoint(drop.x, drop.y).matrixTransform(ctmInv);
      let resolved = null;
      D.querySelectorAll('.slot').forEach(function (g) {
        const p = g.querySelector('path');
        if (p && p.isPointInFill(mp)) resolved = String(g.dataset.adcode);
      });
      line('     引擎公式复算 → 精确命中 ' + (resolved === adcode
        ? adcode + ' ✅' : (resolved === null ? '（不落在任何凹槽里）' : resolved + ' ⚠ 不是本碎片')));

      /* 真实拖拽 */
      const triesBefore = (W.__ENGINE__ && W.__ENGINE__.getState().tries) || 0;
      const from = { x: pr.left + pr.width / 2, y: pr.top + pr.height / 2 };
      function fire(target, type, x, y) {
        target.dispatchEvent(new W.PointerEvent(type, {
          bubbles: true, cancelable: true, composed: true,
          clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse',
          isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1,
        }));
      }
      fire(pieceEl, 'pointerdown', from.x, from.y);
      const steps = 6;
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        fire(D, 'pointermove', from.x + (drop.x - from.x) * t, from.y + (drop.y - from.y) * t);
        await sleep(24);
      }
      const ghostEl = D.querySelector('.drag-ghost');
      const ghostCount = D.querySelectorAll('.drag-ghost').length;
      let ghostInfo = null;
      if (ghostEl) {
        const gr = ghostEl.getBoundingClientRect();
        ghostInfo = {
          w: Math.round(gr.width), h: Math.round(gr.height),
          cx: gr.left + gr.width / 2, cy: gr.top + gr.height / 2,
        };
      }

      /* 空位光晕：拖拽中所有未放置空位应带 is-open */
      const openCount = D.querySelectorAll('.slot.is-open').length;
      const candCount = D.querySelectorAll('.slot.is-candidate').length;
      line('     空位光晕：is-open 共 ' + openCount + ' 个（本关空位 ' +
        D.querySelectorAll('.slot').length + ' 个），is-candidate ' + candCount + ' 个');

      /* 放大镜 */
      const lensEl = D.querySelector('.drag-lens');
      const lensOn = !!(lensEl && lensEl.classList.contains('is-on'));
      let lensInfo = '';
      if (lensEl) {
        const lr = lensEl.getBoundingClientRect();
        const vb = lensEl.querySelector('svg').getAttribute('viewBox');
        lensInfo = '，尺寸 ' + Math.round(lr.width) + '×' + Math.round(lr.height) +
          'px，visible=' + (lensOn ? '是' : '否') +
          '，viewBox="' + vb + '"' +
          '，命中标记 ' + lensEl.querySelectorAll('.lens-slot.is-hit').length + ' 个';
      } else {
        lensInfo = '（未创建）';
      }
      line('     放大镜：' + (lensEl ? '已创建' : '无') + lensInfo);

      /* 【关键验证】按"幽灵实际所在位置"重算遮挡率。
       * 改动前幽灵压在触点上（遮挡率 100%），改动后应让开、露出目标。
       * 这里量的是"碎片矩形压住多少空位内的采样点"，越小 = 目标越看得见。 */
      let covAfter = null;
      if (ghostInfo) {
        const gl = ghostInfo.cx - ghostInfo.w / 2;
        const gt = ghostInfo.cy - ghostInfo.h / 2;
        let coveredAfter = 0;
        samples.forEach(function (s) {
          if (s.x >= gl && s.x <= gl + ghostInfo.w &&
              s.y >= gt && s.y <= gt + ghostInfo.h) coveredAfter++;
        });
        covAfter = samples.length ? coveredAfter / samples.length : 0;
        line('     ★ 让位后遮挡率 = ' + (covAfter * 100).toFixed(1) + '%' +
          '（改动前按触点算是 ' + (cov * 100).toFixed(1) + '%）');
      }

      /* 截图模式：拖到目标后就**不松手**，把画面定格给 node 侧截图，
       * 这样能一次看到"幽灵让位 + 空位光晕 + 放大镜"三者同时生效的样子。 */
      if (HOLD) {
        const rect = frame.getBoundingClientRect();
        line('     [截图模式] 保持拖拽不松手；iframe 在页面中的位置 = ' +
          Math.round(rect.left) + ',' + Math.round(rect.top));
        return;
      }

      fire(D, 'pointerup', drop.x, drop.y);
      try {
        await waitFor(function () {
          const st = W.__ENGINE__ ? W.__ENGINE__.getState() : null;
          return st && st.tries > triesBefore && !D.querySelector('.drag-ghost');
        }, 5000, '拖拽结算');
      } catch (e) { /* 超时让下面判定报 */ }

      const st2 = W.__ENGINE__ ? W.__ENGINE__.getState() : null;
      const placed = st2 && st2.placed ? Array.from(st2.placed).map(String).indexOf(adcode) >= 0 : false;
      line('     幽灵：数量 ' + ghostCount + (ghostInfo
        ? '，尺寸 ' + Math.round(ghostInfo.w) + '×' + Math.round(ghostInfo.h) + 'px，中心 (' +
          ghostInfo.cx.toFixed(0) + ', ' + ghostInfo.cy.toFixed(0) + ')'
        : '（没生成）'));
      line('     幽灵中心相对落点偏移 = ' + (ghostInfo
        ? '(' + (ghostInfo.cx - drop.x).toFixed(1) + ', ' +
          (ghostInfo.cy - drop.y).toFixed(1) + ')px（负值 = 往左上让开）'
        : 'n/a'));
      line('     拖拽结束后残留：.drag-ghost ' + D.querySelectorAll('.drag-ghost').length +
        ' 个，.drag-lens ' + D.querySelectorAll('.drag-lens').length +
        ' 个，is-open ' + D.querySelectorAll('.slot.is-open').length + ' 个（都应为 0）');
      line('     真实拖拽结果：' + (placed ? '✅ 放上去了' : '❌ 没放上去') +
        '（tries ' + triesBefore + ' → ' + (st2 && st2.tries) + '）');
    }
  }

  /* ============ 场景 4：任意被测页的空位尺寸体检 ============
   * 用来回答"某张图的空位在屏幕上到底多少像素" —— 决定放大镜阈值会不会误伤。
   * ?target=engine-host.html 指到别的宿主页；它没有 ?map= 参数，所以整段跳过地图选择。 */
  async function scenarioSizes() {
    const target = new URLSearchParams(location.search).get('target') || '';
    if (!target) return;
    line('\n【场景 4】空位屏幕尺寸体检：' + target);
    const frame = newFrame();
    /* target 是相对 tools/ 的路径（探针自己就在 tools/ 下）：
     *   engine-host.html  → 同目录，直接写名字
     *   ../index.html     → 根目录的正式页面 */
    frame.src = target;
    let ready = null;
    try {
      await new Promise(function (r) { frame.addEventListener('load', r, { once: true }); });
      /* 【为什么要等导航真的完成】刚设完 src 时 contentWindow 还是 about:blank
       * 的窗口（同一个 WindowProxy），此时读 __ENGINE__ 永远读到 null，
       * 而轮询又会一直"看似有效"地跑下去 —— 表现为莫名的超时。
       * 所以先等 readyState 变成 complete，再去读引擎实例。 */
      await waitFor(function () {
        const d = frame.contentDocument;
        return d && d.readyState === 'complete';
      }, 20000, 'iframe 导航完成');
      ready = await waitFor(function () {
        const w = frame.contentWindow;
        return (w && w.__ENGINE__) ||
          (frame.contentDocument && frame.contentDocument.documentElement
            .getAttribute('data-map-ready'));
      }, 20000, '引擎实例出现');
    } catch (e) {
      let diag = '';
      try {
        const w = frame.contentWindow;
        const d = frame.contentDocument;
        diag = '（readyState=' + (d && d.readyState) +
          '，__ENGINE__=' + !!(w && w.__ENGINE__) +
          '，MapPuzzleEngine=' + !!(w && w.MapPuzzleEngine) +
          '，TINY_CITY_CONFIG=' + !!(w && w.TINY_CITY_CONFIG) +
          '，slots=' + (d ? d.querySelectorAll('.slot').length : '?') + '）';
      } catch (e2) { diag = '（读不到 iframe）'; }
      line('  ✘ 引擎没起来：' + e.message + diag);
      return;
    }
    line('  · 引擎就绪（ready=' + JSON.stringify(ready) + '）');
    const W = frame.contentWindow;
    const D = frame.contentDocument;
    const intro = D.getElementById('intro');
    if (intro && !intro.hidden) { intro.click(); await sleep(500); }
    await waitViewStable(D);

    const rows = [];
    D.querySelectorAll('.slot').forEach(function (g) {
      const p = g.querySelector('path');
      if (!p) return;
      const bb = p.getBBox();
      const m = p.getScreenCTM();
      const sc = Math.sqrt(Math.abs(m.a * m.d - m.b * m.c));
      rows.push({
        adcode: String(g.dataset.adcode),
        w: bb.width * sc,
        h: bb.height * sc,
        short: Math.min(bb.width, bb.height),
      });
    });
    rows.sort(function (a, b) { return a.w * a.h - b.w * b.h; });
    line('  空位数 = ' + rows.length + '（按屏幕面积升序）');
    rows.forEach(function (r) {
      line('      ' + r.adcode + '  屏幕 ' + r.w.toFixed(1) + '×' + r.h.toFixed(1) + 'px' +
        '  短边(地图坐标) ' + r.short.toFixed(3) +
        '  → 是否触发放大镜(<30px): ' + (Math.min(r.w, r.h) < 30 ? '是' : '否'));
    });

    /* 针对最小的一块，真拖一次，看放大镜到底有没有出现 */
    if (!rows.length) { line('  没有空位，跳过拖拽'); return; }
    const smallest = rows[0].adcode;
    const to = insidePointOf(W, D, smallest);
    if (!to) { line('  最小空位 ' + smallest + ' 找不到落点，跳过拖拽'); return; }
    const piece = D.querySelector('.piece[data-adcode="' + smallest + '"]');
    const pr = piece.getBoundingClientRect();
    const triesBefore = (W.__ENGINE__ && W.__ENGINE__.getState().tries) || 0;
    const fire = function (t, type, x, y) {
      t.dispatchEvent(new W.PointerEvent(type, {
        bubbles: true, cancelable: true, composed: true,
        clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse',
        isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1,
      }));
    };
    const from = { x: pr.left + pr.width / 2, y: pr.top + pr.height / 2 };
    fire(piece, 'pointerdown', from.x, from.y);
    for (let i = 1; i <= 6; i++) {
      const t = i / 6;
      fire(D, 'pointermove', from.x + (to.x - from.x) * t, from.y + (to.y - from.y) * t);
      await sleep(24);
    }
    const ghost = D.querySelector('.drag-ghost');
    const gr = ghost ? ghost.getBoundingClientRect() : null;
    const lens = D.querySelector('.drag-lens');
    line('  拖最小空位 ' + smallest + ' 时：');
    line('     碎片屏幕 ' + pr.width.toFixed(1) + '×' + pr.height.toFixed(1) + 'px' +
      '，幽灵屏幕 ' + (gr ? gr.width.toFixed(1) + '×' + gr.height.toFixed(1) : '无') + 'px');
    line('     幽灵让位 = ' + (gr && gr.width
      ? '(' + (gr.left + gr.width / 2 - to.x).toFixed(1) + ', ' +
        (gr.top + gr.height / 2 - to.y).toFixed(1) + ')px'
      : 'n/a'));
    line('     空位光晕 is-open = ' + D.querySelectorAll('.slot.is-open').length + ' 个');
    line('     放大镜 = ' + (lens
      ? '出现（visible=' + lens.classList.contains('is-on') + '）'
      : '未出现'));
    fire(D, 'pointerup', to.x, to.y);
    try {
      await waitFor(function () {
        const st = W.__ENGINE__ ? W.__ENGINE__.getState() : null;
        return st && st.tries > triesBefore && !D.querySelector('.drag-ghost');
      }, 5000, '拖拽结算');
    } catch (e) { /* 忽略 */ }
    const st2 = W.__ENGINE__.getState();
    line('     拖拽结果：' + (Array.from(st2.placed).map(String).indexOf(smallest) >= 0
      ? '✅ 放上去了' : '❌ 没放上去'));
    line('     结束后残留：ghost ' + D.querySelectorAll('.drag-ghost').length +
      '，lens ' + D.querySelectorAll('.drag-lens').length +
      '，is-open ' + D.querySelectorAll('.slot.is-open').length);
  }

  async function run() {
    line('EXP 探针 · ' + new Date().toISOString());
    line('目标地图 = ' + MAP + '，目标 adcode = ' + TARGETS.join(', '));
    try { await scenarioSizes(); } catch (e) { line('场景4 异常：' + (e && e.stack)); }
    try { await scenarioDefault(); } catch (e) { line('场景1 异常：' + (e && e.message)); }
    try { await scenarioLevelParam(); } catch (e) { line('场景2 异常：' + (e && e.message)); }
    try { await scenarioTiny(); } catch (e) { line('场景3 异常：' + (e && e.stack)); }
    report({ ok: true });
  }
  run().catch(function (err) {
    line('\n!! 探针自身异常：' + (err && err.stack ? err.stack : err));
    report({ ok: false });
  });
})();
</script>
</body>
</html>
